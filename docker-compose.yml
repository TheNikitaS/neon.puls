services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: neonpulse
      POSTGRES_USER: neonpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neonpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://neonpulse:${POSTGRES_PASSWORD:-change-me}@db:5432/neonpulse
      NEONPULSE_SECRET: ${NEONPULSE_SECRET:-change-me-in-production}
      NEONPULSE_SANDBOX: ${NEONPULSE_SANDBOX:-1}
      NEONPULSE_LLM_PROVIDER: ${NEONPULSE_LLM_PROVIDER:-rules}
      YANDEX_FOLDER_ID: ${YANDEX_FOLDER_ID:-}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_MODEL: ${YANDEX_MODEL:-yandexgpt-lite}
    ports:
      - "8080:8080"

volumes:
  pgdata:
